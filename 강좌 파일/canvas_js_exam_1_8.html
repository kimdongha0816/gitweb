<!DOCTYPE html> <!-- 1번 HTML 문서임을 브라우저에게 알려줌-->
<html lang="en"> <!-- 2번 문서의 언어를 영어로 설정-->
<head>
    <meta charset="UTF-8" /> <!-- 3번 글자가 깨지지 않도록 UTF-8로 문자 인코딩 설정-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- 4번 모바일에서 화면이 잘 보이도록 설정-->
    <title>Web Animation(canvas_js_css)[1단원-1]</title> <!-- 5번 브라우저 탭에 보여질 제목-->
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: sans-serif;
        }
        #canvas {
            background-color: #DCD7C9;
            display: block;
            margin: 0 auto;
        }
        .pc-guide{
            display: none;
            margin-top: 10px;
            font-size: 16px;
            color: #333;
            font-weight:bold;
            
        }
        @media (min-width: 769px) {
            #canvas{
                width: 600px;
                height: 600px;
            }

            .pc-guide{
                display: block;
            }
        }

        .controls{
            display:none;
            margin-top: 10px;
            flex-direction: column;
            align-items: center;
        }
        .controls .row {
            display: flex;
            justify-content: center;
        }
        .controls button{
            font-size:24px;
            padding:15px 20px;
            margin: 5px;
            min-width: 60px;
            border: none;
            background-color: #333;
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .controls button:active{
            background-color: #555;
        }

        #startBtn{
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4caf50;
            font-size: 24px;
            font-weight: bold;
            padding: 30px 60px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        #startBtn:hover{
            background: #4caf50;
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .messageBox{
            display: none;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 2px solid #333;
            padding: 20px;
            z-index: 10;
        }
        @media (max-width: 768px){
            #canvas{
                width:100vw;
                height:100vw;
            }
            .controls {
                display:block;
            }
            .pc-guide{
                display: none;
            }
        }

    </style> <!-- 6번 화면 스타일(css) 적응 완료 -->
</head>
<body>
    <canvas id="canvas"></canvas> <!-- 7번 화면에 캔버스(그림판) 생성-->

    <div id="startBtn">Start</div>

    <div class="messageBox" id="msgBox">
        <div id="messageText"></div>
        <input type="text" id="userId" placeholder="(영어+숫자) 5~15자이내">
        <br>
        <button id="saveBtn">저장</button>
        <button id="cancelBtn">취소</button>
    </div>

    <div class="controls">
        <div class="row">
            <button id="upBtn">↑</button>
        </div>
        <div class="row">
            <button id="leftBtn">←</button>
            <button id="downBtn">↓</button>
            <button id="rightBtn">→</button>
        </div>
    </div>

    <div class="pc-guide">
        PC에서 접속했습니다. 방향키로 이동하세요.<br>
        스마트폰은 접속 시 보이는 버튼으로 이동하세요.
    </div>

    <script type="module">
        import { containsSwearWord } from "https://cdn.jsdelivr.net/gh/bc-develop2000/swear_words@main/swear_words.js"
        window.containsSwearWord = containsSwearWord;

        console.log("[swear] module loaded, sample:", containsSwearWord("fuck","eng"));
    </script>

    <script>
        // 8번 JavaScript 코드 실행 시작

        const drawingBoard = document.getElementById('canvas');//9번 캔버스 요소를 JS 변수로 가져오기
        const drawingPen = drawingBoard.getContext('2d');  //10번 2d로 그림 그릴 수 있는 도구 설정


        drawingBoard.width = 600;  
        drawingBoard.height = 600; 

        let x = (drawingBoard.width-10) / 2; //13번 사각형의 시작 위치 (가운데 정렬)
        let y = (drawingBoard.height-10) / 2;
        const heroSize = 10;

        const redBox = { x: 550, y: 550, size: 50};

        let startTime;
        let gameStarted = false;
        let elapsedTime = 0;
        let stopTime = null;

        function drawTimer() {
            drawingPen.fillStyle = 'blue';
            drawingPen.font = '20px sans-serif';

            if(gameStarted) {
                const elapsedTime = (Date.now() - startTime)/1000;
                drawingPen.fillText(`시간: ${elapsedTime.toFixed(2)}초`, 10, 40);
            } else if (stopTime>0) {
                drawingPen.fillText(`시간: ${stopTime.toFixed(2)}초`, 10, 40);
            }
        }
        
        const msgBox = document.getElementById('msgBox');
        const msgText = document.getElementById('messageText');
        const userIdInput = document.getElementById('userId');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const startBtn = document.getElementById('startBtn');

        function drawRedBox() {
            drawingPen.fillStyle='red';
            drawingPen.fillRect(redBox.x, redBox.y, redBox.size, redBox.size);
        }

        function checkCollision(){
            if(gameStarted && (x+10) > redBox.x && x < (redBox.x+ redBox.size) && (y+10) > redBox.y && y < (redBox.y + redBox.size)){
                gameStarted = false;
                stopTime = (Date.now() - startTime) / 1000;
                showMessage(`충돌! 경과 시간: ${stopTime.toFixed(2)}초\n저장 아이디((영어+숫자) 5~15자이내)를 입력하세요`);
                return true;
            }
            return false;
        }

        function showMessage(text){
            msgText.innerText=text;
            msgBox.style.display = 'block'
            userIdInput.value = '';
            userIdInput.focus();
        }
        saveBtn.addEventListener('click',() => {
            const val = userIdInput.value.trim();

            if(typeof window.containsSwearWord !== 'function') {
                alert('욕설 필터 모듈을 불러오지 못했습니다. (ESM import 확인)');
                console.error('[swear] containsSwearWord not ready');
                return;
            }

            const re = /^(?=.*[a-zA-Z])(?=.*[0-9])[a-zA-Z0-9]{5,15}$/;
            if(containsSwearWord(val,"eng")){
                alert('사용할 수 없는 단어가 포함되어 있습니다.');
                userIdInput.focus();
                return;
            }
            if (!re.test(val)){
                alert('아이디는 영어와 숫자를 반드시 포함한 5~15자여야 합니다.');
                userIdInput.focus();
                return;
            }
            alert(`입력한 아이디는 ${val}입니다.`);
            msgBox.style.display='none';
            resetGame();
        })

        cancelBtn.addEventListener('click', () => {
            msgBox.style.display = 'none';
            resetGame();
        });

        startBtn.addEventListener('click', () => {
            gameStarted=true;
            startTime=Date.now();
            startBtn.style.display = 'none';
        });

        function resetGame(){
            gameStarted=false;
            stopTime = null;
            startBtn.style.display='block';
            x=(drawingBoard.width - 10)/2;
            y=(drawingBoard.height- 10)/2;
        }
        const moveAmount = 5; //14번 방향키 누를 때 이동할 거리(5픽셀)

        //15번 각각의 방향으로 이동하는 함수들
        function moveRight(){
            x = x + moveAmount;
        }

        function moveLeft(){
            x = x - moveAmount;
        }

        function moveDown() {
            y = y + moveAmount;
        }

        function moveUp(){
            y = y - moveAmount;
        }

        function move_limit(){
        if (x < 0) {
            x=0;
        }
    }

        function drawCoordinate(){
            drawingPen.fillStyle = 'black';
            drawingPen.font = '10px sans-serif';
            drawingPen.fillText(`x: ${x} y: ${y}`, 10, 20);
        }

        //16번 주인공(검정 사각형)을 그리는 함수
        function drawHero() {
            drawingPen.fillStyle = 'black';
            drawingPen.fillRect(x, y, 10, 10);
        }

        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false
        };


       document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)){
                keys[e.key] = true;
            }
        });
         document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)){
                keys[e.key] = false;
            }
        });


        //17번 화면을 지우고 주인공을 다시 그림
        function draw() {
            drawingPen.clearRect(0, 0, canvas.width, canvas.height); // 이전 그림 지우기
            drawHero(); // 새 위치에 주인공 그리기

            move_limit();
            drawCoordinate();
            
            drawRedBox();
            drawTimer();

            checkCollision();

            if (gameStarted && stopTime === null){
                if (keys.ArrowLeft) moveLeft();
                if (keys.ArrowRight) moveRight();
                if (keys.ArrowUp) moveUp();
                if (keys.ArrowDown) moveDown();
            }
        }

        //18 1초에 60번 반복해서 draw 함수 실행 (움직임을 부드럽게 보여줌)
        setInterval(draw, 16); 

        const setBtnHold = (key, isDown) => {
            keys[key] = isDown;
        }

        const bindButton = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', () => setBtnHold(key, true));
            btn.addEventListener('touchend', () => setBtnHold(key, false));
            btn.addEventListener('mousedown', () => setBtnHold(key, true));
            btn.addEventListener('mouseup', () => setBtnHold(key, false));
            btn.addEventListener('mouseleave', () => setBtnHold(key, false));
        };
        bindButton("leftBtn", "ArrowLeft");
        bindButton("rightBtn", "ArrowRight");
        bindButton("upBtn", "ArrowUp");
        bindButton("downBtn", "ArrowDown");
    </script>
    </body>
    </html>
