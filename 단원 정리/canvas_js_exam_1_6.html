<!DOCTYPE html> <!-- 1번 HTML 문서임을 브라우저에게 알려줌-->
<html lang="en"> <!-- 2번 문서의 언어를 영어로 설정-->
<head>
    <meta charset="UTF-8" /> <!-- 3번 글자가 깨지지 않도록 UTF-8로 문자 인코딩 설정-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- 4번 모바일에서 화면이 잘 보이도록 설정-->
    <title>Web Animation(canvas_js_css)[1단원-1]</title> <!-- 5번 브라우저 탭에 보여질 제목-->
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: sans-serif;
        }
        #canvas {
            background-color: #DCD7C9;
            display: block;
            margin: 0 auto;
        }
        .pc-guide{
            display: none;
            margin-top: 10px;
            font-size: 16px;
            color: #333;
            font-weight:bold;
            
        }
        @media (min-width: 769px) {
            #canvas{
                width: 600px;
                height: 600px;
            }

            .pc-guide{
                display: block;
            }
        }

        .controls{
            display:none;
            margin-top: 10px;
        }
        .controls button{
            font-size:18px;
            padding:10px 20px;
            margin: 5px;
        }

        @media (max-width: 768px){
            #canvas{
                width:100vw;
                height:100vw;
            }
            .controls {
                display:block;
            }
            .pc-guide{
                display: none;
            }
        }
        .retry {
            position: absolute;
            top: 550px;
            left: 50%;
        }

    </style> <!-- 6번 화면 스타일(css) 적응 완료 -->
</head>
<body>
    <canvas id="canvas"></canvas> <!-- 7번 화면에 캔버스(그림판) 생성-->

    <div class="controls">
        <button id="leftBtn">←</button>
        <button id="rightBtn">→</button>
        <button id="upBtn">↑</button>
        <button id="downBtn">↓</button>
    </div>

    <div class="pc-guide">
        PC에서 접속했습니다. 방향키로 이동하세요.<br>
        스마트폰은 접속 시 보이는 버튼으로 이동하세요.
    </div>

    <div class="retry">
        <button id="retryBtn">재도전</button>
    </div>


    <script>
        // 8번 JavaScript 코드 실행 시작

        const drawingBoard = document.getElementById('canvas');//9번 캔버스 요소를 JS 변수로 가져오기
        const drawingPen = drawingBoard.getContext('2d');  //10번 2d로 그림 그릴 수 있는 도구 설정
        const retryBtn = document.getElementById("retryBtn");// HTML에서 재도전 버튼을 찾아 변수에 저장
        retryBtn.style.display = "none";
        // 캔버스 크기를 CSS와 맞춰줌 (중요!)
        drawingBoard.width = drawingBoard.clientWidth; //11번 실제 캔버스 너비를 css와 일치시킴
        drawingBoard.height = drawingBoard.clientHeight; //12번 실제 캔버스 높이도 맞춰줌

        let x = (drawingBoard.width-30); //13번 사각형의 시작 위치 (가운데 정렬)
        let y = (drawingBoard.height-30);
        //적 위치
        let enemy = [];

        for(let i = 0; i < 5; i++){
            enemy[i] = {
                x: Math.random() * (drawingBoard.width - 20),
                y: Math.random() * (drawingBoard.height - 20)
            }
}

        const moveAmount = 5; //14번 방향키 누를 때 이동할 거리(5픽셀)

        //15번 각각의 방향으로 이동하는 함수들
        function moveRight(){
            x = x + moveAmount;
        }

        function moveLeft(){
            x = x - moveAmount;
        }

        function moveDown() {
            y = y + moveAmount;
        }

        function moveUp(){
            y = y - moveAmount;
        }

        function move_limit(){
        if (x < 0) x = 0;
        if (x > drawingBoard.width - 10) x = drawingBoard.width - 10;
        if (y < 0) y = 0;
        if (y > drawingBoard.height - 10) y = drawingBoard.height - 10;
        }

        function drawCoordinate(){
            drawingPen.fillStyle = 'black';
            drawingPen.font = '10px sans-serif';
            drawingPen.fillText(`x: ${x} y: ${y}`, 10, 20);
            drawingPen.fillText(time.toFixed(2) + " 초", 300, 20);
            drawingPen.fillText("RED no " + redCount, 540, 20); //갯수표시 사각형
        }

        //16번 주인공(검정 사각형)을 그리는 함수
        function drawHero() {
            drawingPen.fillStyle = 'black';
            drawingPen.fillRect(x, y, 10, 10);
        }

        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false
        };
        //적소환 함수
        function enemy1(){
            drawingPen.fillStyle = 'red';
            for(let i = 0;i<5;i++){
                drawingPen.fillRect(enemy[i].x, enemy[i].y,20,20)
            }
        }
        function collision1(){
            for(let i = 0;i<5;i++){
                 if(x+10>enemy[i].x&&
                    x<enemy[i].x+20&&
                    y+10>enemy[i].y&&
                    y<enemy[i].y+20){
                        enemy[i].x=-30;
                        enemy[i].y=-30;
                        redCount--; // 빨간색 사각형 개수 1 감소
                    }
            }
        }

        let time=0;// 타이머에 사용할 변수 만들기

        // 10밀리초마다 반복 실행하는 기능
        setInterval(function() {
        if (redCount != 0) {
            time += 0.01;
             }
        }, 10);

        let redCount = 5; // 빨간색 사각형의 개수

        function gameClear() {
        drawingPen.fillStyle = "black";
        drawingPen.font = "40px sans-serif";
        drawingPen.textAlign = "center";
        retryBtn.style.display = "block";

         drawingPen.fillText(
            "미션 해결! 시간: " + time.toFixed(2) + "초",
            canvas.width / 2,
            canvas.height / 2
            );
            retryBtn.addEventListener("click", function() {

         // 주인공 위치 초기화
        x = drawingBoard.width - 30;
        y = drawingBoard.height - 30;

        // 적 5마리 위치 다시 정하기
        for(let i = 0; i < 5; i++){
            enemy[i].x = Math.random() * (drawingBoard.width - 20);
            enemy[i].y = Math.random() * (drawingBoard.height - 20);
        }

        // 남은 적 수와 시간 초기화
        redCount = 5;
        time = 0;

        // 버튼 숨기기
        retryBtn.style.display = "none";

        // 글자 정렬 초기화
        drawingPen.textAlign = "left";
        });
    }
        

       document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)){
                keys[e.key] = true;
            }
        });
         document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)){
                keys[e.key] = false;
            }
        });


        //17번 화면을 지우고 주인공을 다시 그림
        function draw() {
            drawingPen.clearRect(0, 0, canvas.width, canvas.height); // 이전 그림 지우기
            drawHero(); // 새 위치에 주인공 그리기
            if (redCount == 0) {
                 gameClear();
                return;
                }
            enemy1();
            move_limit();
            drawCoordinate();
            collision1();
            if (keys.ArrowLeft) moveLeft();
            if (keys.ArrowRight) moveRight();
            if (keys.ArrowUp) moveUp();
            if (keys.ArrowDown) moveDown();
        }

        //18 1초에 60번 반복해서 draw 함수 실행 (움직임을 부드럽게 보여줌)
        setInterval(draw, 16); 

        // PC 방향키 조작
        //19번 키보드를 누르면 해당 방향으로 이동하게 함

        document.getElementById('leftBtn').addEventListener('click',moveLeft);
        document.getElementById('rightBtn').addEventListener('click',moveRight);
        document.getElementById('upBtn').addEventListener('click',moveUp);
        document.getElementById('downBtn').addEventListener('click',moveDown);
    </script>
    </body>
    </html>
