<!DOCTYPE html> <!-- 1번 HTML 문서임을 브라우저에게 알려줌-->
<html lang="en"> <!-- 2번 문서의 언어를 영어로 설정-->
<head>
    <meta charset="UTF-8" /> <!-- 3번 글자가 깨지지 않도록 UTF-8로 문자 인코딩 설정-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- 4번 모바일에서 화면이 잘 보이도록 설정-->
    <title>Web Animation(canvas_js_css)[1단원-1]</title> <!-- 5번 브라우저 탭에 보여질 제목-->
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: sans-serif;
        }
        #canvas {
            background-color: #DCD7C9;
            display: block;
            margin: 0 auto;
        }
        @media (min-width: 769px) {
            #canvas{
                width: 600px;
                height: 600px;
            }
        }
    </style> <!-- 6번 화면 스타일(css) 적응 완료 -->
</head>
<body>
    <canvas id="canvas"></canvas> <!-- 7번 화면에 캔버스(그림판) 생성-->
    <script>
        // 8번 JavaScript 코드 실행 시작

        const drawingBoard = document.getElementById('canvas');//9번 캔버스 요소를 JS 변수로 가져오기
        const drawingPen = drawingBoard.getContext('2d');  //10번 2d로 그림 그릴 수 있는 도구 설정

        // 캔버스 크기를 CSS와 맞춰줌 (중요!)
        drawingBoard.width = drawingBoard.clientWidth; //11번 실제 캔버스 너비를 css와 일치시킴
        drawingBoard.height = drawingBoard.clientHeight; //12번 실제 캔버스 높이도 맞춰줌

        let x = (drawingBoard.width-30); //13번 사각형의 시작 위치 (가운데 정렬)
        let y = (drawingBoard.height-30);

        let enemy1x = (drawingBoard.width-10)/2; //13번 사각형의 시작 위치 (가운데 정렬)
        let enemy1y = (drawingBoard.height-10)/2;

        const moveAmount = 5; //14번 방향키 누를 때 이동할 거리(5픽셀)

        //15번 각각의 방향으로 이동하는 함수들
        function moveRight(){
            x = x + moveAmount;
        }

        function moveLeft(){
            x = x - moveAmount;
        }

        function moveDown() {
            y = y + moveAmount;
        }

        function moveUp(){
            y = y - moveAmount;
        }

        function move_limit(){
            if (x<0){
                x = 0;
            }
            if (x>590){
                x=590;
            }
            if (y<0){
                y=0;
            }
            if (y>590){
                y=590;
            }
        }

        function drawCoordinate(){
            drawingPen.fillStyle = 'black';
            drawingPen.font = '10px sans-serif';
            drawingPen.fillText(`x: ${x} y: ${y}`, 10, 20);
        }

        //16번 주인공(검정 사각형)을 그리는 함수
        function drawHero() {
            drawingPen.fillStyle = 'black';
            drawingPen.fillRect(x, y, 10, 10);
        }
        //적소환 함수
        function enemy1(){
            drawingPen.fillStyle = 'red';
            drawingPen.fillRect(enemy1x, enemy1y,20,20)
        }
        function collision1(){
            if(x+10>enemy1x&&
               x<enemy1x+20&&
               y+10>enemy1y&&
               y<enemy1y+20){
                enemy1x=-30
                enemy1y=-30
            }
        }
        //17번 화면을 지우고 주인공을 다시 그림
        function draw() {
            drawingPen.fillText(`x: ${x} y: ${y}`, 10, 20);
            drawingPen.clearRect(0, 0, canvas.width, canvas.height); // 이전 그림 지우기
            drawHero(); // 새 위치에 주인공 그리기
            enemy1();
            move_limit();
            drawCoordinate();
            collision1();
        }

        //18 1초에 60번 반복해서 draw 함수 실행 (움직임을 부드럽게 보여줌)
        setInterval(draw, 16); 

        // PC 방향키 조작
        //19번 키보드를 누르면 해당 방향으로 이동하게 함
        document.addEventListener('keydown', (e) => {
            // 눌린 키(e.key)가 무엇인지 확인해서 아래 명령 실행
            switch (e.key){
                case 'ArrowLeft': moveLeft(); break; // 왼쪽 화살표 눌렀을 떄
                case 'ArrowRight': moveRight(); break; // 오른쪽 화살표 눌렀을 때
                case 'ArrowUp': moveUp(); break;  // 위쪽 화살표 눌렀을 때
                case 'ArrowDown': moveDown(); break; //아래쪽 화살표 눌렀을 때
            }
        });
    </script>
    </body>
    </html>
